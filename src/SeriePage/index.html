<html lang="fr">

  <nav class="navbar">

      <button class="carousel-btn right" aria-label="Suivant">&#10095;</button>
    </div>

    <div class="carousel" data-url="https://api.themoviedb.org/3/discover/tv?language=fr-FR&sort_by=popularity.desc&with_genres=35&page=1" data-type="tv">
