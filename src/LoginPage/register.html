<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetflixLight — Inscription</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="../HomePage/index.html" class="navbar__logo">NetflixLight</a>
    <div class="navbar__actions">
      <a href="index.html" class="btn btn--secondary btn--sm">Se connecter</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <p class="auth-card__subtitle">Créez votre compte pour continuer</p>

      <div class="auth-card__form">
        <div class="form-group">
          <label for="pseudo">Pseudo</label>
          <input class="form-control" type="text" id="pseudo" placeholder="Votre pseudo" autocomplete="nickname" />
        </div>

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input class="form-control" type="email" id="email" placeholder="email@exemple.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input class="form-control" type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button class="btn btn--primary btn--lg btn--full" onclick="handleRegister()">
          Créer mon compte
        </button>
      </div>

      <div class="auth-card__footer">
        Déjà un compte ? <a href="index.html">Se connecter</a>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
