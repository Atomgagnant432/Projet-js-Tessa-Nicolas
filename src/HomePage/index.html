<!DOCTYPE html>
<html lang="fr">
<head> 
    <meta charset="UTF-8">
    <title>NetflixLight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span>NetflixLight</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Rechercher un film ou une série...">
        </div>
        <ul class="nav-links">
            <li>Accueil</li>
            <li>Film</li>
            <li>Série</li>
            <li>Profil</li>
        </ul>
    </nav>
    
    <header class="pres">
        <div class="presproj">
        <h1>un projet étudiant</h1>
        </div>
    </header>

    <section id="search-results" class="movie-row"></section>

    <main class="carrousels">

        <!-- trending --> 
            <div class="carousel" data-url="https://api.themoviedb.org/3/trending/movie/week?language=fr-FR&page=1">
                <h2>Tendances du moment</h2>
                <button class="carousel-btn left">&#10094;</button>
                <div class="movie-row"></div>
                <button class="carousel-btn right">&#10095;</button>
                </div>
                
        <!--popular movie-->
            <div class="carousel" data-url="https://api.themoviedb.org/3/movie/popular?language=fr">
                <h2>Films populaire</h2>
                <button class="carousel-btn left">&#10094;</button>
                <div class="movie-row"></div>
                <button class="carousel-btn right">&#10095;</button>
                </div>

        <!-- popular serie -->
            <div class="carousel" data-url="https://api.themoviedb.org/3/tv/popular?language=fr-FR&page=1">
                <h2>Série populaire</h2>
                <button class="carousel-btn left">&#10094;</button>
                <div class="movie-row"></div>
                <button class="carousel-btn right">&#10095;</button>
                </div>

        <!-- top rating -->
            <div class="carousel" data-url="https://api.themoviedb.org/3/movie/top_rated?language=fr-FR&page=1">
                <h2>Contenus mieux noté</h2>
                <button class="carousel-btn left">&#10094;</button>
                <div class="movie-row"></div>
                <button class="carousel-btn right">&#10095;</button>
                </div>
    </main>
    <script src="script.js" defer></script>
    <script src="search.js" defer></script>
</body>
</html>
